name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the local toolchain: the lockfile is written by npm 11 (Node 26),
          # and npm 10 resolves shadcn-svelte's kit peer differently and rejects it.
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Served at the root of https://concierge.tbtfw.com (the Pages custom domain), so no base
          # path. The old https://tbtfwsourcing.github.io/tbtfw-portal/ links redirect there.
          BASE_PATH: ''
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
